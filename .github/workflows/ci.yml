name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.13.0
      - name: Verify npm version
        run: npm --version
      - name: Install dependencies
        run: npm ci
      - name: Validate commit messages
        run: npm run commitlint:ci
        env:
          COMMITLINT_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMITLINT_TO: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit and architecture tests
        run: npm test
      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.4.1 validate runtime-kernel-phase-1 --strict --no-interactive

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_DB: tego_next_test
          POSTGRES_PASSWORD: tego_test
          POSTGRES_USER: tego_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U tego_test -d tego_next_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.13.0
      - name: Verify npm version
        run: npm --version
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run integration tests
        timeout-minutes: 10
        run: npm run test:integration
        env:
          TEGO_POSTGRES_URL: postgresql://tego_test:tego_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/tego_next_test
          TEGO_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/tego-test-artifacts
      - name: Upload integration diagnostics
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: postgres-integration-diagnostics
          path: ${{ runner.temp }}/tego-test-artifacts
          if-no-files-found: ignore
          retention-days: 7

  system-e2e:
    name: Main and Worker process E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_DB: tego_next_test
          POSTGRES_PASSWORD: tego_test
          POSTGRES_USER: tego_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U tego_test -d tego_next_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.13.0
      - name: Verify npm version
        run: npm --version
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run single-Main system smoke
        timeout-minutes: 8
        run: npm run test:e2e:single-main
        env:
          TEGO_POSTGRES_URL: postgresql://tego_test:tego_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/tego_next_test
          TEGO_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/tego-test-artifacts
      - name: Run multi-Main takeover
        timeout-minutes: 8
        run: npm run test:e2e:multi-main
        env:
          TEGO_POSTGRES_URL: postgresql://tego_test:tego_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/tego_next_test
          TEGO_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/tego-test-artifacts
      - name: Upload process diagnostics
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: process-e2e-diagnostics
          path: ${{ runner.temp }}/tego-test-artifacts
          if-no-files-found: ignore
          retention-days: 7
