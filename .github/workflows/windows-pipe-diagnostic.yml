name: Temporary Windows pipe diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-pipe-diagnostic:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm run build --workspace @tego/cli
      - run: node scripts/run-windows-pipe-access-diagnostic.mjs
